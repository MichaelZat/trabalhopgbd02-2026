{
  "openapi": "3.0.3",
  "info": {
    "title": "API de Bilheteria",
    "version": "1.0.0",
    "description": "Escopo do Trabalho Final 2026/2. Operações de gerência e bilheteria exigem OPERADOR. Cada cliente acessa somente suas reservas e ingressos. Os exemplos não definem novos limites de negócio."
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    },
    {
      "cookieAuth": []
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "session"
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "perfil": {
            "type": "string",
            "enum": [
              "CLIENTE",
              "OPERADOR"
            ]
          }
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "erro": {
            "type": "object",
            "properties": {
              "codigo": {
                "type": "string"
              },
              "mensagem": {
                "type": "string"
              }
            }
          }
        }
      },
      "Event": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "FILME",
              "EVENTO"
            ]
          }
        }
      },
      "Seat": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "row": {
            "type": "string"
          },
          "number": {
            "type": "integer"
          }
        }
      },
      "Room": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "assentos": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Seat"
            }
          }
        }
      },
      "Session": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "roomId": {
            "type": "string",
            "format": "uuid"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "price": {
            "type": "string",
            "description": "Decimal em reais"
          },
          "event": {
            "$ref": "#/components/schemas/Event"
          },
          "room": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "format": "uuid"
              },
              "name": {
                "type": "string"
              },
              "_count": {
                "type": "object",
                "properties": {
                  "assentos": {
                    "type": "integer"
                  }
                }
              }
            }
          }
        }
      },
      "Map": {
        "type": "object",
        "properties": {
          "horarioServidor": {
            "type": "string",
            "format": "date-time"
          },
          "assentos": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "row": {
                  "type": "string"
                },
                "number": {
                  "type": "integer"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "LIVRE",
                    "RESERVADO",
                    "VENDIDO"
                  ]
                },
                "minhaReserva": {
                  "type": "boolean"
                }
              }
            }
          }
        }
      },
      "Selection": {
        "type": "object",
        "required": [
          "sessaoId",
          "assentosSessaoIds"
        ],
        "properties": {
          "sessaoId": {
            "type": "string",
            "format": "uuid"
          },
          "assentosSessaoIds": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          }
        }
      },
      "IssuedTicket": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "codigo": {
            "type": "string"
          },
          "issuedAt": {
            "type": "string",
            "format": "date-time"
          },
          "usedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        }
      },
      "Reservation": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "userId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "PENDENTE",
              "PAGA",
              "EXPIRADA"
            ]
          },
          "channel": {
            "type": "string",
            "enum": [
              "INTERNET",
              "BALCAO"
            ]
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "total": {
            "type": "string"
          },
          "session": {
            "$ref": "#/components/schemas/Session"
          },
          "payment": {
            "type": "object",
            "nullable": true,
            "properties": {
              "id": {
                "type": "string",
                "format": "uuid"
              },
              "amount": {
                "type": "string"
              },
              "paidAt": {
                "type": "string",
                "format": "date-time"
              },
              "simulated": {
                "type": "boolean"
              }
            }
          },
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "unitPrice": {
                  "type": "string"
                },
                "sessionSeat": {
                  "type": "object",
                  "properties": {
                    "seat": {
                      "$ref": "#/components/schemas/Seat"
                    }
                  }
                },
                "ticket": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/IssuedTicket"
                    }
                  ],
                  "nullable": true
                }
              }
            }
          }
        }
      },
      "Ticket": {
        "allOf": [
          {
            "$ref": "#/components/schemas/IssuedTicket"
          },
          {
            "type": "object",
            "properties": {
              "sessionSeat": {
                "type": "object",
                "properties": {
                  "seat": {
                    "$ref": "#/components/schemas/Seat"
                  },
                  "session": {
                    "$ref": "#/components/schemas/Session"
                  }
                }
              },
              "item": {
                "type": "object",
                "properties": {
                  "unitPrice": {
                    "type": "string"
                  },
                  "reservation": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "userId": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "channel": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            }
          }
        ]
      },
      "Report": {
        "type": "object",
        "properties": {
          "sessaoId": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "room": {
            "type": "string"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "capacidade": {
            "type": "integer"
          },
          "vendidos": {
            "type": "integer"
          },
          "utilizados": {
            "type": "integer"
          },
          "receita": {
            "type": "string"
          },
          "taxaOcupacao": {
            "type": "number",
            "description": "Vendidos / capacidade * 100"
          }
        }
      }
    }
  },
